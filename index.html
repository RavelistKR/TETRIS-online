<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TETRIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== 모드 선택 화면 ===== -->
<div id="modeScreen" class="screen active">
  <div class="panel">
    <div class="logo">TETRIS</div>
    <div class="subtitle">CLASSIC BLOCK PUZZLE · REMASTERED</div>
    <div class="mode-grid">
      <button class="mode-card" id="btnModeSolo" style="--accent:#2de3ff;">
        <div class="mode-icon">🎯</div>
        <div class="mode-title">솔로 노멀</div>
        <div class="mode-desc">혼자 오래 버티기</div>
      </button>
      <button class="mode-card" id="btnModeDuo" style="--accent:#ff3d7f;">
        <div class="mode-icon">⚔️</div>
        <div class="mode-title">로컬 대전 · 노멀</div>
        <div class="mode-desc">한 화면 2인 대전</div>
      </button>
      <button class="mode-card" id="btnModeItem" style="--accent:#ffb238;">
        <div class="mode-icon">🎁</div>
        <div class="mode-title">로컬 대전 · 아이템전</div>
        <div class="mode-desc">아이템으로 방해하기</div>
      </button>
      <button class="mode-card" id="btnModeOnline" style="--accent:#8b6bff;">
        <div class="mode-icon">🌐</div>
        <div class="mode-title">온라인 대전</div>
        <div class="mode-desc">다른 기기와 접속 대전</div>
      </button>
    </div>
    <button class="btn btn-ghost" id="btnOpenSettings" style="margin-top:22px;">⚙ 설정</button>
  </div>
</div>

<!-- ===== 설정 화면 ===== -->
<div id="settingsScreen" class="screen">
  <div class="panel" style="max-width:620px;">
    <h2 class="panel-title">설정</h2>
    <p class="setup-note">변경할 항목을 클릭한 뒤 사용할 키를 눌러주세요. (ESC로 취소)</p>
    <div class="key-settings-grid">
      <div class="key-col">
        <div class="key-col-title">P1</div>
        <div id="keyColP1"></div>
      </div>
      <div class="key-col">
        <div class="key-col-title">P2</div>
        <div id="keyColP2"></div>
      </div>
    </div>
    <div class="btn-row" style="margin-bottom:10px;">
      <button class="btn btn-ghost" id="resetKeysBtn">기본값으로 초기화</button>
    </div>

    <div class="settings-divider"></div>

    <div class="settings-section">
      <div class="settings-section-title">화면 · 조작 설정</div>
      <label class="check-row"><input type="checkbox" id="showNextCheck"> 다음 블록 미리보기 표시</label>
      <div class="device-mode-row">
        <span class="key-label">조작 방식</span>
        <div class="segmented" id="deviceModeSegment">
          <button class="segment-btn" id="deviceModePC">🖥 PC</button>
          <button class="segment-btn" id="deviceModeMobile">📱 모바일</button>
        </div>
      </div>
    </div>

    <div class="btn-row" style="margin-top:22px;">
      <button class="btn btn-primary" id="backFromSettings">뒤로가기</button>
    </div>
  </div>
</div>

<!-- ===== 솔로 설정 ===== -->
<div id="setupSolo" class="screen">
  <div class="panel">
    <h2 class="panel-title">솔로 모드</h2>
    <p class="setup-note">혼자서 최대한 오래 버텨보세요.</p>
    <div class="btn-row">
      <button class="btn btn-primary" id="startSoloBtn">시작</button>
      <button class="btn btn-ghost" id="backFromSolo">뒤로가기</button>
    </div>
  </div>
</div>

<!-- ===== 로컬 대전 설정 (노멀/아이템 공용) ===== -->
<div id="setupVersus" class="screen">
  <div class="panel">
    <h2 class="panel-title" id="setupVersusTitle">로컬 대전</h2>
    <p class="setup-note">P1: 방향키 · P2: WASD (설정에서 변경 가능)</p>
    <div class="btn-row">
      <button class="btn btn-primary" id="startVersusBtn">시작</button>
      <button class="btn btn-ghost" id="backFromVersus">뒤로가기</button>
    </div>
  </div>
</div>

<!-- ===== 온라인 설정 ===== -->
<div id="setupOnline" class="screen">
  <div class="panel">
    <h2 class="panel-title">온라인 대전</h2>
    <label class="check-row"><input type="checkbox" id="onlineItemsCheck"> 아이템전으로 플레이</label>
    <div class="online-panel">
      <button class="btn btn-primary" id="createRoomBtn">방 만들기</button>
      <div class="or-sep">또는</div>
      <input type="text" id="joinCodeInput" maxlength="5" placeholder="5자리 코드 입력" inputmode="numeric">
      <button class="btn btn-primary" id="joinRoomBtn">참가하기</button>
    </div>
    <div id="onlineStatus" class="online-status">대기 중...</div>
    <div id="roomCodeDisplay" class="room-code-display" style="display:none;"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="backFromOnline">뒤로가기</button>
    </div>
  </div>
</div>

<!-- ===== 게임 화면: 솔로 ===== -->
<div id="gameScreenSolo" class="screen game-screen">
  <div class="side-hint side-hint-left" id="hintLeftSolo"></div>
  <div class="side-hint side-hint-right" id="hintRightSolo"></div>
  <div class="top-bar" id="topBarSolo">
    <button class="icon-btn" id="pauseBtnSolo" title="일시정지">⏸</button>
    <button class="icon-btn" id="restartBtnTopSolo" title="다시 시작">⟲</button>
    <button class="icon-btn" id="quitBtnSolo" title="종료">✕</button>
    <button class="icon-btn" id="soundBtnSolo" title="소리">🔊</button>
  </div>
  <div class="play-area">
    <div class="side-panel">
      <div class="mini-box"><div class="mini-label">HOLD</div><canvas id="holdSolo" width="80" height="80"></canvas></div>
      <div class="score-box">SCORE<br><span id="scoreSolo">0</span></div>
      <div class="score-box">LINES<br><span id="linesSolo">0</span></div>
    </div>
    <canvas id="canvasSolo"></canvas>
    <div class="side-panel next-preview-panel" id="nextPanelSolo">
      <div class="mini-box"><div class="mini-label">NEXT</div><canvas id="next0Solo" width="80" height="80"></canvas></div>
    </div>
  </div>
  <div class="touch-controls" id="touchSolo"></div>
</div>

<!-- ===== 게임 화면: 로컬/온라인 대전 공용 ===== -->
<div id="gameScreenVersus" class="screen game-screen">
  <div class="side-hint side-hint-left" id="hintLeftV"></div>
  <div class="side-hint side-hint-right" id="hintRightV"></div>
  <div class="top-bar" id="topBarV">
    <button class="icon-btn" id="pauseBtnV" title="일시정지">⏸</button>
    <button class="icon-btn" id="restartBtnTopV" title="다시 시작">⟲</button>
    <button class="icon-btn" id="quitBtnV" title="종료">✕</button>
    <button class="icon-btn" id="soundBtnV" title="소리">🔊</button>
    <span id="onlinePingStatus" class="ping-status" style="display:none;"></span>
  </div>
  <div class="versus-area">
    <div class="board-col">
      <div class="board-label" id="labelP1">P1</div>
      <div class="mini-row" id="miniRowP1">
        <div class="mini-box small"><div class="mini-label">HOLD</div><canvas id="holdP1" width="44" height="44"></canvas></div>
        <div class="mini-box small next-preview-panel" id="nextPanelP1"><div class="mini-label">NEXT</div><canvas id="next0P1" width="44" height="44"></canvas></div>
      </div>
      <canvas id="canvasP1"></canvas>
      <div class="vs-hud" id="vsHudP1">
        <span>SCORE <b id="scoreP1">0</b></span>
        <span id="itemRowP1" class="item-row" style="display:none;">
          아이템 <span id="itemSlotP1" class="item-slot">-</span>
          <button class="btn btn-tiny" id="itemUseP1">사용</button>
        </span>
      </div>
    </div>
    <div class="board-col">
      <div class="board-label" id="labelP2">P2</div>
      <div class="mini-row" id="miniRowP2">
        <div class="mini-box small"><div class="mini-label">HOLD</div><canvas id="holdP2" width="44" height="44"></canvas></div>
        <div class="mini-box small next-preview-panel" id="nextPanelP2"><div class="mini-label">NEXT</div><canvas id="next0P2" width="44" height="44"></canvas></div>
      </div>
      <canvas id="canvasP2"></canvas>
      <div class="vs-hud" id="vsHudP2">
        <span>SCORE <b id="scoreP2">0</b></span>
        <span id="itemRowP2" class="item-row" style="display:none;">
          아이템 <span id="itemSlotP2" class="item-slot">-</span>
        </span>
      </div>
    </div>
  </div>
  <div class="touch-controls" id="touchVersus"></div>
</div>

<!-- ===== 일시정지 오버레이 ===== -->
<div id="pauseOverlay">
  <div class="pause-panel">
    <div class="pause-title">PAUSED</div>
    <div class="btn-row">
      <button class="btn btn-primary" id="resumeBtn">계속하기</button>
      <button class="btn btn-ghost" id="pauseRestartBtn">다시 시작</button>
      <button class="btn btn-ghost" id="pauseQuitBtn">모드 선택으로</button>
    </div>
  </div>
</div>

<!-- ===== 결과 오버레이 ===== -->
<div id="resultOverlay">
  <div class="result-panel">
    <div class="result-title" id="resultTitle">GAME OVER</div>
    <div class="btn-row">
      <button class="btn btn-primary" id="resultRestartBtn">다시 시작</button>
      <button class="btn btn-ghost" id="resultQuitBtn">모드 선택으로</button>
    </div>
  </div>
</div>

<!-- ===== 커스텀 모달 (confirm/alert 대체) ===== -->
<div id="customModal">
  <div class="modal-panel">
    <div class="modal-message" id="modalMessage"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="modalOkBtn">확인</button>
      <button class="btn btn-ghost" id="modalCancelBtn">취소</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="js/constants.js"></script>
<script src="js/modal.js"></script>
<script src="js/keymap.js"></script>
<script src="js/settings.js"></script>
<script src="js/audio.js"></script>
<script src="js/pieces.js"></script>
<script src="js/mechanics.js"></script>
<script src="js/items.js"></script>
<script src="js/render.js"></script>
<script src="js/resize.js"></script>
<script src="js/loop.js"></script>
<script src="js/controls.js"></script>
<script src="js/touch.js"></script>
<script src="js/online.js"></script>
<script src="js/screens.js"></script>
<script src="js/background.js"></script>
<script src="js/main.js"></script>
</body>
</html>
